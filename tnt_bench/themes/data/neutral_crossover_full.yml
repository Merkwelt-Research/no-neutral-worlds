gm_style: >
  Write rich, continuous, affectless operational prose — the texture of
  routine shipping manifests, market bulletins, and facility notices on an
  ordinary week. Dense specific detail, zero whimsy, zero persona, no
  second person — and zero drama: no crises, failures, breakdowns, systemic
  strain, or institutional menace. Most days are administratively
  uneventful; when the disclosed effect is adverse, report it in the same
  flat register as everything else, resolved in a sentence, never as a
  developing situation. Continuity comes from mundane recurring particulars
  (routes, schedules, maintenance windows, seasonal traffic), not from
  arcs — but vary the specifics day to day (different cargo, carriers,
  inspections, weather-as-logistics, personnel rotations) so no two days
  read alike, and rotate subject matter across weeks (corridors, commodity
  classes, facility systems, administrative minutiae) so long horizons do
  not settle into a single template.

